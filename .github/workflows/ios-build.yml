# Adds the native iOS project to each Capacitor game on a real macOS runner.
#
# Why this exists: `npx cap add ios` requires macOS + Xcode, and this box is Linux. That single
# mechanical step is the only thing between the 3 web games and an App Store submission (row 1,
# deadline 2026-08-22). A GitHub-hosted macos runner does it for free on public repos.
#
# What it DOES: installs Capacitor, generates ios/ for each game, and builds unsigned to prove
# the project compiles. Uploads ios/ as an artifact so the generated project can be committed.
# What it does NOT do: sign, or upload to App Store Connect. Signing needs the owner's Apple
# certificates and an App Store Connect API key — that is his identity, not the agent's.
name: iOS project generate + unsigned build

on:
  workflow_dispatch:
  push:
    paths:
      - "games/**/capacitor.config.json"

jobs:
  ios:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        game: [untangle, pin-rescue, gate-rush]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor
        working-directory: games/${{ matrix.game }}
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install @capacitor/core @capacitor/cli @capacitor/ios --no-audit --no-fund

      # `cap add ios` generates the Xcode project and THEN runs `pod install`. The pod step
      # fails because the Podfile Capacitor writes targets an iOS version below what
      # Capacitor 7 requires ("required a higher minimum deployment target"). So: let the
      # generate step run, raise the deployment target in the Podfile it just wrote, and
      # install the pods ourselves.
      - name: Generate the iOS project (pods may fail here — expected)
        working-directory: games/${{ matrix.game }}
        run: npx cap add ios || echo "cap add exited non-zero; continuing to patch the Podfile"

      # Do not guess the version — read the minimum Capacitor itself declares in its podspec
      # and write exactly that into the Podfile. Hardcoding 14.0 was still too low.
      - name: Match the Podfile deployment target to Capacitor's own podspec
        working-directory: games/${{ matrix.game }}
        run: |
          SPEC=$(ls node_modules/@capacitor/ios/*.podspec | head -1)
          echo "podspec: $SPEC"
          TARGET=$(grep -Eo "deployment_target[[:space:]]*=[[:space:]]*['\"][0-9.]+" "$SPEC" \
                   | grep -Eo "[0-9.]+$" | head -1)
          echo "Capacitor requires iOS $TARGET"
          test -n "$TARGET"
          sed -i '' "s/^platform :ios.*/platform :ios, '$TARGET'/" ios/App/Podfile
          grep '^platform' ios/App/Podfile

      - name: Install pods
        working-directory: games/${{ matrix.game }}/ios/App
        run: pod install --repo-update

      - name: Sync web assets into the iOS project
        working-directory: games/${{ matrix.game }}
        run: npx cap sync ios

      - name: Build unsigned (proves the project compiles)
        working-directory: games/${{ matrix.game }}/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Upload the generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.game }}
          path: games/${{ matrix.game }}/ios
          retention-days: 14
