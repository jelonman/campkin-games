name: iOS build

# Two jobs, and the split is the whole point.
#
# Godot's iOS exporter writes its Xcode project from a template full of placeholders
# ($pbx_embeded_frameworks, $additional_pbx_files, $additional_pbx_resources_refs and three
# more). On Linux it substitutes all six. On a macos-14 runner it leaves them RAW in the file,
# which is why every Xcode from 15.0.1 to 15.4 answered "The project 'Pinfall' is damaged and
# cannot be opened due to a parse error" — a bare $placeholder where a value belongs is not
# valid OpenStep plist. Proven by diff, not guessed: the two files are byte-identical apart
# from those six lines, 15,864 bytes against 16,032.
#
# So Godot never runs on the Mac again. Linux exports the Xcode project and hands it over as an
# artifact; the Mac does the one thing only a Mac can do, which is compile it. Linux minutes
# also bill at 1x against the Mac's 10x, so the expensive runner now holds the job for the
# shortest time it possibly can.

on:
  workflow_dispatch:
  push:
    # Root-relative. The project lives in pinfall/, so "export_presets.cfg" matched NOTHING and
    # a push that changed the icons and the team id triggered no build at all, while a monitor
    # watching "the latest run" reported the PREVIOUS run's failure as if it were the new one.
    # A filter that silently matches nothing is worse than no filter.
    paths:
      - "pinfall/**"
      - ".github/workflows/pinfall-ios.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the iOS export templates
        run: |
          set -euo pipefail
          V=4.6.3-stable
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          chmod +x Godot_v${V}_linux.x86_64
          # The engine looks for templates under a version-named directory; the archive unpacks
          # to a generic 'templates' folder, so it has to be moved rather than just extracted.
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${V/-/.}"
          ./Godot_v${V}_linux.x86_64 --version || true
          test -f pinfall/project.godot || (echo 'project.godot NOT at pinfall/' && ls -R . | head -30 && exit 1)

      - name: Import assets
        run: |
          set -euo pipefail
          # --headless --quit does NOT import. That cost a render of pure white: every material
          # fell back to untextured because the .import files did not exist. And every Godot
          # call is bounded, because a Godot that hits a prompt with no tty waits forever —
          # that is the 32-minute silent hang, not slowness.
          timeout 420 ./Godot_v4.6.3-stable_linux.x86_64 --headless --path pinfall --import \
            < /dev/null > import.log 2>&1 || true
          tail -20 import.log
          test -d pinfall/.godot/imported || (echo "IMPORT PRODUCED NOTHING" && exit 1)

      - name: Export the Xcode project
        run: |
          set -euo pipefail
          mkdir -p pinfall/export
          timeout 780 ./Godot_v4.6.3-stable_linux.x86_64 --headless --path pinfall \
            --export-debug "iOS" export/Pinfall.ipa < /dev/null > export.log 2>&1 || true
          tail -20 export.log
          # Godot exits non-zero after writing the Xcode project because it cannot also sign an
          # .ipa here. Judge the step by the ARTEFACT, which is what the next job consumes.
          test -d pinfall/export/Pinfall.xcodeproj || \
            (echo "no Xcode project produced" && ls -R pinfall/export && exit 1)
          # The failure this whole split exists to prevent. Assert it here, on the cheap runner,
          # rather than discovering it as a parse error on the expensive one.
          if grep -qE '\$(pbx_|additional_pbx_)' pinfall/export/Pinfall.xcodeproj/project.pbxproj; then
            echo "UNSUBSTITUTED PLACEHOLDERS IN pbxproj:"
            grep -nE '\$(pbx_|additional_pbx_)' pinfall/export/Pinfall.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "pbxproj is fully substituted:"; wc -c pinfall/export/Pinfall.xcodeproj/project.pbxproj

      - uses: actions/upload-artifact@v4
        with:
          name: pinfall-xcodeproj
          path: pinfall/export/
          retention-days: 7

  compile:
    needs: export
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinfall-xcodeproj
          path: export

      - name: Compile the generated project (unsigned)
        run: |
          set -euo pipefail
          # Signing is deliberately off. Apple does not allow app-record creation over the API
          # ("The resource 'apps' does not allow 'CREATE'"), so a signed upload needs the record
          # to exist first. It now does, 6797051442, and signing is a second workflow. This one
          # proves the compile on every push, which is the thing that kept breaking.
          xcodebuild -version
          ls -la export/Pinfall.xcodeproj/
          plutil -lint export/Pinfall.xcodeproj/project.pbxproj || true
          cd export
          xcodebuild -list -project Pinfall.xcodeproj | tee list.log
          # Godot emits a TARGET, not a scheme, and -scheme on a project with no shared schemes
          # fails with the same misleading "Unable to read project". Ask, do not assume.
          TARGET=$(awk '/Targets:/{f=1;next} /^$/{f=0} f{print $1; exit}' list.log)
          echo "building target: ${TARGET:-Pinfall}"
          xcodebuild -project Pinfall.xcodeproj -target "${TARGET:-Pinfall}" \
            -configuration Debug -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40
          # Judge by the artefact. A piped xcodebuild hands back the exit code of `tail`.
          APP=$(find dd -name "*.app" -maxdepth 6 | head -1)
          test -n "$APP" || (echo "NO .app WAS PRODUCED" && exit 1)
          echo "built: $APP"; du -sh "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: pinfall-ios-app
          path: export/dd/Build/Products/
          retention-days: 7
